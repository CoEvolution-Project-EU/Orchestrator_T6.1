name: Build and Push Docker Image and Deploy

on:
  push:
    branches:
      - main          # runs every time you push to main
  pull_request:
    branches:
      - main          # runs on pull requests to main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coevolution-project-eu/orchestrator_t6.1

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # needed to push to GitHub Container Registry

    steps:
      # Step 1 — checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # automatically provided by GitHub

      # Step 3 — extract metadata (tags, labels) for the image
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      # Step 4 — build and push the image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}  # only push on main, not PR
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── NEW: deploy to the ICCS cluster ─────────────────────────
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: coevolution-runner          # the ARC runner set inside the cluster
    concurrency:
      group: deploy-orchestrator
      cancel-in-progress: false

    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy the new image
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          echo "Deploying $IMAGE"
          kubectl -n default set image deployment/backend backend="$IMAGE"

      - name: Wait until the new pod is ready
        run: kubectl -n default rollout status deployment/backend --timeout=180s