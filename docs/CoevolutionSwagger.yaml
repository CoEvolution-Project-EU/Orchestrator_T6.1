openapi: 3.0.3
info:
  title: CoEvolution Hub Components API
  version: 0.1.0
  description: |
    API specification based on the currently identified endpoints.

tags:
  - name: User & Credentials Management (UA) (AEGIS)
  - name: Orchestrator (ORCH) (AEGIS)
  - name: Report Pool (RP) (AEGIS)
  - name: Trusted Resources Pool (TRP) (AEGIS)
  - name: Security Assurance Pool (SAP) (CBRL)
  - name: Assessment Pool (AP) (SLC)
  - name: Security Trust Robustness Defence Pool (STRDP) (UNICA)

paths:
  /api/auth/login:
    post:
      tags: [User & Credentials Management (UA) (AEGIS)]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /api/auth/logout:
    post:
      tags: [User & Credentials Management (UA) (AEGIS)]
      summary: User logout
      responses:
        '200':
          description: Logout successful

  /api/auth/token:
    get:
      tags: [User & Credentials Management (UA) (AEGIS)]
      summary: Get current auth token or session info
      responses:
        '200':
          description: Token retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'

  /api/auth/users/{id}:
    get:
      tags: [User & Credentials Management (UA) (AEGIS)]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/auth/users/roles:
    post:
      tags: [User & Credentials Management (UA) (AEGIS)]
      summary: Assign or update user roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleRequest'
      responses:
        '200':
          description: User roles updated successfully

  /api/orchestrator/model/register:
    post:
      tags: [Orchestrator (ORCH) (AEGIS)]
      summary: Register model in orchestrator
      description: Register a model lifecycle data model and return its UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelRegisterRequest'
      responses:
        '202':
          description: Model registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UUIDResponse'

  /api/orchestrator/dataset/generate:
    post:
      tags: [Orchestrator (ORCH) (AEGIS)]
      summary: Generate dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetGenerateRequest'
      responses:
        '202':
          description: Dataset generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

  /api/orchestrator/monitoring/start:
    post:
      tags: [Orchestrator (ORCH) (AEGIS)]
      summary: Start monitoring
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitoringStartRequest'
      responses:
        '202':
          description: Monitoring started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

  /api/orchestrator/aimbom/generate:
    post:
      tags: [Orchestrator (ORCH) (AEGIS)]
      summary: Generate AIMBOM
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AimbomGenerateRequest'
      responses:
        '202':
          description: AIMBOM generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'

  /api/orchestrator/status/{job_id}:
    get:
      tags: [Orchestrator (ORCH) (AEGIS)]
      summary: Get job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'

  /api/reportpool/{sub_pool}:
    post:
      tags: [Report Pool (RP) (AEGIS)]
      summary: Store report
      parameters:
        - name: sub_pool
          in: path
          required: true
          schema:
            type: string
            example: assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPayload'
      responses:
        '201':
          description: Report stored successfully

  /api/reportpool/{model_uuid}:
    get:
      tags: [Report Pool (RP) (AEGIS)]
      summary: Get reports by model UUID
      parameters:
        - name: model_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportPayload'

  /api/reportpool/{model_uuid}/{sub_pool}:
    get:
      tags: [Report Pool (RP) (AEGIS)]
      summary: Get reports by model UUID and selected sub pool
      parameters:
        - name: model_uuid
          in: path
          required: true
          schema:
            type: string
        - name: sub_pool
          in: path
          required: true
          schema:
            type: string
            example: assessment
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportPayload'

  /api/trustedresourcespool/datasets:
    post:
      tags: [Trusted Resources Pool (TRP) (AEGIS)]
      summary: Store dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetPayload'
      responses:
        '201':
          description: Dataset stored successfully

  /api/trustedresourcespool/datasets/{dataset_id}:
    get:
      tags: [Trusted Resources Pool (TRP) (AEGIS)]
      summary: Get dataset by dataset ID
      parameters:
        - name: dataset_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dataset retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPayload'

  /api/trustedresourcespool/model:
    post:
      tags: [Trusted Resources Pool (TRP) (AEGIS)]
      summary: Store trusted model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPayload'
      responses:
        '201':
          description: Model stored successfully

  /api/trustedresourcespool/model/{model_uuid}:
    get:
      tags: [Trusted Resources Pool (TRP) (AEGIS)]
      summary: Get trusted model by UUID
      parameters:
        - name: model_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPayload'

 
  /api/securityassurancepool/{sub_pool}:
    post:
      tags: [Security Assurance Pool (SAP) (CBRL)]
      summary: Store ??
      parameters:
        - name: sub_pool
          in: path
          required: true
          schema:
            type: string
            example: assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPayload'
      responses:
        '201':
          description: ?? stored successfully

  /api/securityassurancepool/{model_uuid}:
    get:
      tags: [Security Assurance Pool (SAP) (CBRL)]
      summary: Get ??
      parameters:
        - name: model_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ?? retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportPayload'

  /api/assessmentpool/{sub_pool}:
    post:
      tags: [Assessment Pool (AP) (SLC)]
      summary: Store ??
      parameters:
        - name: sub_pool
          in: path
          required: true
          schema:
            type: string
            example: assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPayload'
      responses:
        '201':
          description: ?? stored successfully

  /api/assessmentpool/{model_uuid}:
    get:
      tags: [Assessment Pool (AP) (SLC)]
      summary: Get ?? by model UUID
      parameters:
        - name: model_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ?? retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportPayload'

  /api/strdppool/{sub_pool}:
    post:
      tags: [Security Trust Robustness Defence Pool (STRDP) (UNICA)]
      summary: Store ??
      parameters:
        - name: sub_pool
          in: path
          required: true
          schema:
            type: string
            example: assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportPayload'
      responses:
        '201':
          description: ?? stored successfully

  /api/strdppool/{model_uuid}:
    get:
      tags: [Security Trust Robustness Defence Pool (STRDP) (UNICA)]
      summary: Get ?? by model UUID
      parameters:
        - name: model_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ?? retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportPayload'

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          example: coevolution_user
        password:
          type: string
          format: password
          example: secret123
      required:
        - username
        - password

    AuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: eyJhbGciOi...
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600

    User:
      type: object
      properties:
        id:
          type: string
          example: user-123
        username:
          type: string
          example: demo_user
        email:
          type: string
          example: demo@example.com
        roles:
          type: array
          items:
            type: string
          example: [admin, operator]

    UserRoleRequest:
      type: object
      properties:
        user_id:
          type: string
          example: user-123
        roles:
          type: array
          items:
            type: string
          example: [admin, viewer]
      required:
        - user_id
        - roles

    ModelRegisterRequest:
      $ref: '#/components/schemas/ModelPayload'

    ModelPayload:
      type: object
      properties:
        name:
          type: string
          example: model name
        model_uuid:
          type: string
          example: 4ff2dab7-bffe-414d
        owner:
          type: string
          example: coevuser
        description:
          type: object
          additionalProperties:
            type: string
          example:
            key: text description of model
        date:
          type: string
          format: date
          example: 2026-03-03
        type:
          type: string
          example: modeltype1
        attacks:
          type: array
          items:
            type: string
          example: [ATK-001, ATK-002]
        defences:
          type: array
          items:
            type: string
          example: [DEF-001, DEF-002]
        assessments:
          type: array
          items:
            type: string
          example: [ASM-001, ASM-002]
        reports:
          type: array
          items:
            type: string
          example: [REP-001, REP-002, REP-003]
        trusted:
          type: boolean
          example: true
        requirements:
          type: string
          example: Must satisfy project baseline requirements
      required:
        - name
        - model_uuid
        - owner
        - date
        - type
        - trusted

    DatasetGenerateRequest:
      type: object
      properties:
        model_uuid:
          type: string
          example: 4ff2dab7-bffe-414d
        dataset_name:
          type: string
          example: synthetic-dataset-v1
        parameters:
          type: object
          additionalProperties: true
      required:
        - model_uuid
        - dataset_name

    MonitoringStartRequest:
      type: object
      properties:
        target_uuid:
          type: string
          example: 4ff2dab7-bffe-414d
        mode:
          type: string
          example: runtime

    AimbomGenerateRequest:
      type: object
      properties:
        model_uuid:
          type: string
          example: 4ff2dab7-bffe-414d
        dataset_id:
          type: string
          example: dataset-001
        options:
          type: object
          additionalProperties: true
      required:
        - model_uuid

    JobResponse:
      type: object
      properties:
        job_id:
          type: string
          example: job-789
        status:
          type: string
          example: accepted

    UUIDResponse:
      type: object
      properties:
        model_uuid:
          type: string
          example: 4ff2dab7-bffe-414d
        status:
          type: string
          example: accepted

    JobStatusResponse:
      type: object
      properties:
        job_id:
          type: string
          example: job-789
        status:
          type: string
          example: running
        progress:
          type: integer
          example: 60
        result_ref:
          type: string
          nullable: true
          example: report-123

    AimbomPayload:
      type: object
      properties:
        model_uuid:
          type: string
          example: 4ff2dab7-bffe-414d
        aimbom:
          type: object
          additionalProperties: true

    ReportEntry:
      type: object
      properties:
        attack_id:
          type: string
          example: ATK-001
        defence_ids:
          type: array
          items:
            type: string
          example: [DEF-001]
        confidence:
          type: string
          example: medium
        severity:
          type: string
          example: medium
      required:
        - attack_id
        - defence_ids
        - confidence
        - severity

    ReportPayload:
      type: object
      properties:
        report_id:
          type: string
          example: REP-tool_A-4ff2dab7-20260120T184500Z-001
        report_type:
          type: string
          example: assessment_report
        timestamp_utc:
          type: string
          format: date-time
          example: 2026-01-20T18:45:00Z
        model_uuid:
          type: string
          example: 4ff2dab7-bffe-414d
        tool_id:
          type: string
          example: tool_A
        has_defence:
          type: boolean
          example: true
        report:
          type: array
          items:
            $ref: '#/components/schemas/ReportEntry'
      required:
        - report_id
        - report_type
        - timestamp_utc
        - model_uuid
        - tool_id
        - has_defence
        - report

    DatasetPayload:
      type: object
      properties:
        dataset_id:
          type: string
          example: dataset-001
        name:
          type: string
          example: trusted-dataset
        metadata:
          type: object
          additionalProperties: true
      required:
        - dataset_id
        - name
